name: CI

# Every ready pull request and every push to `main` gets a run, and every run
# ends in **`CI ok`**: the one check the `main` ruleset requires (README,
# "Protecting main"). It passes only when every other job passed or was
# skipped by design. A required check that never reports leaves a pull request
# pending forever, so this workflow has no `paths:` filter.
#
# What a change skips is the **jobs**. The first one, `changes`, diffs the
# change and asks `tools/ci_paths.py`, which holds the one path list:
# `backend` and `frontend` run only when it printed `true` for their layer,
# so a Markdown-only change runs `changes`, `tools` and `CI ok` and nothing
# heavy. `tools` runs on every change: it is seconds of stdlib Python and
# ruff, and it is where checks that read the docs belong (the docs lint).
# `regression` runs on every pull request and decides for itself: it reads
# the description, and is seconds when no regression test is owed.
#
# A job added to this file is gated only once it is listed under `CI ok`'s
# `needs:`. `tools/tests/test_ci_workflow.py` fails until it is.
#
# Drafts run nothing: every job is skipped (`changes`, `tools` and
# `regression` carry the draft condition, the layer jobs skip with `changes`,
# `CI ok` carries it too). A draft cannot merge, so there is nothing to check
# yet.
# `ready_for_review` in `types:` is what brings the run that counts, and
# leaving it out fails open: a draft marked ready with no new push would never
# get a run, and its skipped checks would read as passing. `edited` is left
# out, since every title or body edit would re-run CI. The cost is that
# retargeting a pull request's base, or editing a description `regression`
# reads, brings no new run; push a commit, or close and reopen it, to get one.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A push to a pull request cancels the run of the head it replaced. That run's
# `CI ok` then reports red, on a commit that is no longer the head and cannot
# merge. Pushes to `main` get a group per commit and are never cancelled, so
# every commit on `main` carries a real verdict and a red one always means a
# job failed. `CI ok` keeps `always()` rather than `!cancelled()`: a cancelled
# run must not leave the head with a skipped `CI ok`, which reads as passing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Which layers this change touches. The diff is of what would land: on a
  # pull request the checkout is GitHub's merge commit, whose first parent is
  # the base branch's tip, so `HEAD^1..HEAD` is exactly the change; on `main`
  # it is the push's `before..HEAD`. `--no-renames` lists both ends of a
  # rename. A diff that cannot be read (a `before` outside the shallow fetch,
  # a force push) runs every job rather than guessing.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend || 'true' }}
      frontend: ${{ steps.diff.outputs.frontend || 'true' }}
      code: ${{ steps.diff.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Decide which jobs run
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          # core.quotePath=false: a non-ASCII path comes out as itself, not
          # as a quoted octal escape that matches no pattern.
          if files=$(git -c core.quotePath=false diff --name-only --no-renames "$BASE" HEAD); then
            printf '%s\n' "$files"
            printf '%s\n' "$files" | python tools/ci_paths.py | tee -a "$GITHUB_OUTPUT"
          else
            echo "Could not diff against $BASE; running every job."
            printf 'backend=true\nfrontend=true\ncode=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  # The repository's own tools, their lint and tests, and the docs lint, on
  # every change.
  tools:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Only ruff, at the backend's pin: tools/ itself is stdlib-only.
      - name: Install ruff
        run: python -m pip install "$(grep -E '^ruff==' backend/requirements-dev.txt)"

      - name: Run tools gates
        run: make tools TOOLS_PYTHON=python RUFF=ruff

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start postgres (pgvector)
        run: docker compose up -d --build --wait postgres

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend gates
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
          JWT_SECRET: ci-secret-not-for-production-use-only
        run: make backend PYTHON=python

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history: it fetches every branch, so `origin/main` exists and
      # `git merge-base HEAD origin/main` can be read by the gates that compare
      # against what `main` already has (the API contract check).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Bun's version lives in one place: `packageManager` in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      # setup-bun only caches the bun binary itself, so the dependency cache is
      # ours to keep, keyed on the lockfile.
      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Run frontend gates
        run: make frontend

  # Whether a bug fix carries a test that fails without it: `plan` reads the
  # pull request's description, and when it closes an issue labelled `fix`,
  # `run` lays the changed tests over the base (`HEAD^1`) and needs one to fail
  # there (`tools/regression.py`; `make regression PR=N` is its local twin).
  # Only the layers whose tests it runs are set up, and nothing when no test
  # is owed. The description is read over REST when the job runs, not from the
  # event: editing it starts no run, but re-running this job, a push, or
  # closing and reopening the pull request reads the edit. Pushes to `main`
  # skip it: they have no description to read, and the pull request that
  # brought them was checked.
  regression:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # No token left in .git/config for the pull request's test code to read.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Does this pull request owe a regression test?
        id: plan
        # The token reads the description and the issues; the later step,
        # which runs the pull request's test code, gets none.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: make regression-plan PR="$PR" BASE=HEAD^1 TOOLS_PYTHON=python

      # The backend job's setup, for a backend test.
      - name: Start postgres (pgvector)
        if: steps.plan.outputs.backend == 'true'
        run: docker compose up -d --build --wait postgres

      - uses: actions/setup-python@v7
        if: steps.plan.outputs.backend == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        if: steps.plan.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # The frontend job's setup, for a frontend test; `run` installs the
      # base's own packages from this cache.
      - uses: oven-sh/setup-bun@v2
        if: steps.plan.outputs.frontend == 'true'
        with:
          bun-version-file: frontend/package.json

      - name: Cache bun dependencies
        if: steps.plan.outputs.frontend == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run the changed tests on the base
        if: steps.plan.outputs.owed == 'true'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
          JWT_SECRET: ci-secret-not-for-production-use-only
        run: make regression-run BASE=HEAD^1 TOOLS_PYTHON=python PYTHON=python

  # The one check the ruleset requires: its `name:` is the context string the
  # ruleset names, so renaming it unguards `main`. `always()` so it reports
  # when a job it needs failed or was cancelled; a skipped required check reads
  # to GitHub as a satisfied one. `failure` or `cancelled` anywhere fails it;
  # `skipped` is a job `changes` said had nothing to check (or one that waited
  # on a failure, which fails this on its own).
  ok:
    name: CI ok
    needs: [changes, tools, backend, frontend, regression]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or had nothing to check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'length > 0 and all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null; then
            echo "::error::CI is not ok: a job failed or was cancelled."
            exit 1
          fi
