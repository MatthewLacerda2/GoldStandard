[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# F: pyflakes, E/W: pycodestyle, B: bugbear, I: isort, UP: pyupgrade, ANN: annotations.
select = ["F", "E", "W", "B", "I", "UP", "ANN"]
# E501 (line length) is owned by the formatter, not the linter.
# ANN401 forbids typing.Any, which we deliberately use for JWT payloads.
ignore = ["E501", "ANN401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection helpers are called in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Tests do not need return-type annotations on every fixture/test function.
"tests/**" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mutation testing: run it through `make back-mutate`, never bare. The target
# refuses an accidental whole-scope run and drops the test databases a killed
# mutant leaves behind. What it is for and how to triage: backend/CLAUDE.md.
[tool.mutmut]
# Everything with logic in it. `repositories/` is in because a query is where a
# wrong filter (an ownership check, an ordering) goes unnoticed; `api/`,
# `models/` and `schemas/` are declarations the tests exercise but don't decide.
source_paths = ["core", "repositories", "services", "utils"]
# mutmut copies only `source_paths` into `mutants/` and runs the tests there,
# so everything else the suite imports or reads is copied too. A missing entry
# fails loudly on the first, unmutated run.
also_copy = ["api", "models", "schemas", "tests", "tools", "main.py", "pytest.ini"]
# The whole suite: mutmut records which tests reach each function and runs only
# those against its mutants. A hand-picked list produces false survivors.
pytest_add_cli_args_test_selection = ["tests"]
