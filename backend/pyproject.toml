[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# F: pyflakes, E/W: pycodestyle, B: bugbear, I: isort, UP: pyupgrade, ANN: annotations.
select = ["F", "E", "W", "B", "I", "UP", "ANN"]
# E501 (line length) is owned by the formatter, not the linter.
# ANN401 forbids typing.Any, which we deliberately use for JWT payloads.
ignore = ["E501", "ANN401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection helpers are called in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Tests do not need return-type annotations on every fixture/test function.
# `**/` so the glob means the same from backend/ and from the root, where
# `make tools-lint` reads this file for tools/ (and tools/tests/).
"**/tests/**" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mutation testing: run it through `make back-mutate`, never bare. The driver
# (`tools/mutate.py`) refuses an accidental whole-scope run and gives each test
# process a database of its own. What it is for and how to triage a survivor:
# backend/CLAUDE.md, "Mutation testing".
[tool.mutmut]
# The logic: everything under `services/`, `core/` and `utils/` (a new module
# there is mutated without touching this file), then the sensitive files
# outside them (`mutation-sensitive.txt`; a test fails when one is missing
# here). A handler is decorated, and mutmut makes no mutant of a decorated
# function: `api/v1/auth.py` is here so a change to it is named in the block.
source_paths = ["services", "core", "utils", "api/deps.py", "api/v1/auth.py"]
# mutmut copies only `source_paths` (and `tests/`, `pyproject.toml`) into
# `mutants/` and runs the tests there, so everything else the suite imports or
# reads is copied too. A missing entry fails the first, unmutated run, and the
# driver prints pytest's error. A sensitive file inside a copied directory is
# copied back unmutated and mutated again: a moment, no verdict changed.
also_copy = [
    "api",
    "models",
    "repositories",
    "schemas",
    "tools",
    "main.py",
    "pytest.ini",
    "mutation-sensitive.txt",
    ".env",
]
# The whole suite: mutmut records which tests reach each function and runs only
# those against its mutants. A hand-picked list produces false survivors.
pytest_add_cli_args_test_selection = ["tests"]
# Never the default `fork`: it runs the suite in mutmut's own process and forks
# every mutant from it, so each one inherits the conftest that process
# imported. The fork server keeps test code out of the parent, each mutant
# imports the conftest itself and takes its own database (`tools/mutation_db.py`),
# and the preload list keeps that import short.
process_isolation = "forkserver"
forkserver_warmup = "import"
preload_modules_file = "tools/mutation_preload.txt"
# A mutant's wall-clock limit is (its tests' time + this) x 15. The default 1 s
# lets ten processes importing the app at once time out before any test runs.
timeout_constant = 5.0
